name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-build:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome via Ultracite)
        run: bun x ultracite check

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test (shared types)
        run: bun test packages/types/src/schemas.test.ts
