pre-commit:
  parallel: false
  jobs:
    - name: lint (biome via ultracite)
      run: bun x ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true

    - name: prisma generate
      run: cd apps/api && bun x prisma generate

    - name: typecheck
      run: bun run check-types

    - name: build
      run: bun run build
