services:
  postgres:
    image: postgres:16-alpine
    container_name: luma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luma
    ports:
      # loopback only - never expose the dev database to the LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - luma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  luma_pgdata:
